services:

  # =======================================================
  # Laravel PHP-FPM
  # =======================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: portal-app:latest

    container_name: laravel_app

    restart: unless-stopped

    working_dir: /var/www

    volumes:
      # Source code
      - .:/var/www

      # Jangan ditimpa source code host
      - vendor:/var/www/vendor

      # Laravel storage
      - storage:/var/www/storage

    networks:
      - laravel

    depends_on:
      db:
        condition: service_healthy

    environment:
      APP_ENV: local
      APP_DEBUG: "true"

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: portalmahasiswa
      DB_USERNAME: root
      DB_PASSWORD: password

      QUEUE_CONNECTION: database


  # =======================================================
  # Nginx
  # =======================================================
  nginx:
    image: nginx:latest

    container_name: laravel_nginx

    restart: unless-stopped

    ports:
      - "8000:80"

    volumes:
      - .:/var/www

      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - laravel

    depends_on:
      - app


  # =======================================================
  # MySQL
  # =======================================================
  db:
    image: mysql:8.0

    container_name: laravel_db

    restart: always

    environment:
      MYSQL_DATABASE: portalmahasiswa
      MYSQL_ROOT_PASSWORD: password

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - laravel

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-ppassword"
        ]

      timeout: 5s
      interval: 5s
      retries: 10

    command:
      - --performance_schema=ON
      - --innodb_buffer_pool_size=256M


  # =======================================================
  # phpMyAdmin
  # =======================================================
  phpmyadmin:
    image: phpmyadmin/phpmyadmin

    container_name: laravel_phpmyadmin

    restart: always

    ports:
      - "8080:80"

    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: password

    networks:
      - laravel

    depends_on:
      - db


  # =======================================================
  # Queue Worker
  # =======================================================
  queue:
    image: portal-app:latest

    container_name: laravel_queue

    restart: unless-stopped

    working_dir: /var/www

    volumes:
      - .:/var/www
      - vendor:/var/www/vendor
      - storage:/var/www/storage

    networks:
      - laravel

    depends_on:
      - app
      - db

    command:
      - php
      - artisan
      - queue:work
      - --sleep=3
      - --tries=3
      - --max-time=3600


  # =======================================================
  # Laravel Scheduler
  # =======================================================
  scheduler:
    image: portal-app:latest

    container_name: laravel_scheduler

    restart: unless-stopped

    working_dir: /var/www

    volumes:
      - .:/var/www
      - vendor:/var/www/vendor
      - storage:/var/www/storage

    networks:
      - laravel

    depends_on:
      - app
      - db

    command:
      - php
      - artisan
      - schedule:work


# =========================================================
# Volumes
# =========================================================
volumes:

  vendor:

  storage:

  mysql_data:


# =========================================================
# Network
# =========================================================
networks:

  laravel:
    driver: bridge